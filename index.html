<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2b53">
<title>Victor — Les aventures à la montagne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#241734; --sky:#8ed1e6; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#0d1b2a;
    font-family:'Fredoka',system-ui,sans-serif;
    touch-action:none;overscroll-behavior:none;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1b2a;}
  canvas#game{
    image-rendering:pixelated;image-rendering:crisp-edges;
    display:block;background:#0d1b2a;touch-action:none;
  }

  /* ---------- Overlay (réutilisé pour accueil / règles / fin) ---------- */
  .overlay{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:20px;z-index:10;color:#fff;overflow:auto;
    background:
      radial-gradient(circle at 50% 28%, rgba(255,159,26,.18), transparent 60%),
      linear-gradient(180deg,#2a1a4a 0%,#1d2b53 55%,#13203f 100%);
  }
  .overlay.gone{display:none;}

  .badge{
    font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px;
    color:#ffd166;text-shadow:2px 2px 0 #b5179e;margin-bottom:16px;
    animation:bob 2.2s ease-in-out infinite;
  }
  h1{
    font-family:'Press Start 2P',monospace;
    font-size:clamp(18px,4.8vw,36px);line-height:1.45;color:#fff;
    text-shadow:0 4px 0 #2a9d8f,0 8px 0 #176055,0 9px 14px rgba(0,0,0,.5);
    margin-bottom:6px;
  }
  h1 .red{color:#7ee0c0;}
  .sub{
    font-family:'Fredoka';font-weight:600;font-size:clamp(14px,3.4vw,19px);
    color:#bfe9ff;margin:12px 0 22px;max-width:34ch;line-height:1.5;
  }
  .btn{
    font-family:'Press Start 2P',monospace;font-size:clamp(11px,2.6vw,15px);
    color:#241734;background:linear-gradient(180deg,#ffd166,#ffb703);
    border:0;border-radius:14px;padding:16px 26px;cursor:pointer;
    box-shadow:0 6px 0 #c97b00,0 10px 18px rgba(0,0,0,.4);
    transition:transform .08s ease,box-shadow .08s ease;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c97b00,0 4px 10px rgba(0,0,0,.4);}
  .btn2{ color:#0b2236;background:linear-gradient(180deg,#a7e0fb,#5aa8e0);
    box-shadow:0 6px 0 #2a6a9a,0 10px 18px rgba(0,0,0,.4); }
  .btn2:active{transform:translateY(4px);box-shadow:0 2px 0 #2a6a9a,0 4px 10px rgba(0,0,0,.4);}
  .btnrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:4px;}

  .how{
    margin-top:22px;display:grid;gap:8px;max-width:380px;
    font-family:'Fredoka';font-weight:500;font-size:14px;color:#e9d8ff;
  }
  .how div{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;}
  .how .ic{font-size:20px;width:26px;text-align:center;flex:0 0 auto;}

  .score-big{
    font-family:'Press Start 2P',monospace;font-size:clamp(15px,3.6vw,24px);
    color:#ffd166;margin:8px 0 4px;text-shadow:2px 2px 0 #b5179e;
  }
  .best{font-family:'Fredoka';font-weight:600;color:#9bb8ff;margin-bottom:20px;font-size:15px;}
  .gone{display:none!important;}

  #rotate{
    position:fixed;inset:0;z-index:20;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#13203f;color:#fff;text-align:center;padding:30px;
    font-family:'Fredoka';font-weight:600;
  }
  #rotate.show{display:flex;}
  #rotate .phone{font-size:64px;animation:rot 1.8s ease-in-out infinite;}
  @keyframes rot{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  .credit{position:fixed;bottom:6px;left:0;right:0;text-align:center;
    font-family:'Fredoka';font-size:11px;color:rgba(255,255,255,.35);z-index:11;}

  #muteBtn{
    position:fixed;top:10px;right:10px;z-index:12;
    width:42px;height:42px;border:0;border-radius:11px;
    background:rgba(20,12,40,.5);color:#fff;font-size:20px;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .08s ease;
  }
  #muteBtn:active{transform:scale(.9);}
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>

  <!-- Overlay unique (accueil / règles / fin) -->
  <div class="overlay" id="overlay">
    <div class="badge" id="ovBadge"></div>
    <h1 id="ovTitle"></h1>
    <p class="sub" id="ovSub"></p>
    <div class="how" id="ovHow"></div>
    <div class="score-big gone" id="ovScore"></div>
    <div class="best gone" id="ovBest"></div>
    <div class="btnrow">
      <button class="btn" id="ovPrimary">JOUER ▶</button>
      <button class="btn btn2 gone" id="ovSecondary">RETOUR</button>
    </div>
    <div class="credit" id="ovCredit">Fait avec ❤️ pour Victor</div>
  </div>

  <!-- Astuce rotation -->
  <div id="rotate">
    <div class="phone">📱</div>
    <div style="font-size:18px">Tourne ton téléphone</div>
    <div style="opacity:.7;font-size:14px">On joue mieux à l'horizontale&nbsp;!</div>
  </div>

  <button id="muteBtn" aria-label="Activer ou couper la musique">🔊</button>

<script>
"use strict";
(() => {
  /* ======================================================================
     SOCLE COMMUN : canvas, échelle, helpers de dessin
     ====================================================================== */
  const VW = 320, VH = 180;

  const display = document.getElementById('game');
  const dctx = display.getContext('2d');
  const buf = document.createElement('canvas');
  buf.width = VW; buf.height = VH;
  const ctx = buf.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  dctx.imageSmoothingEnabled = false;

  let scale = 1, offX = 0, offY = 0;
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    display.width = Math.floor(w * dpr);
    display.height = Math.floor(h * dpr);
    display.style.width = w + 'px';
    display.style.height = h + 'px';
    dctx.setTransform(dpr,0,0,dpr,0,0);
    dctx.imageSmoothingEnabled = false;
    scale = Math.min(w / VW, h / VH);
    offX = (w - VW * scale) / 2;
    offY = (h - VH * scale) / 2;
    checkOrientation();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize,200));

  function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w,h); }
  function circleFill(cx,cy,r){
    for(let y=-r;y<=r;y+=2){ const w=Math.sqrt(r*r-y*y)|0; ctx.fillRect((cx-w)|0,(cy+y)|0,w*2,2); }
  }
  function fillTri(ax,ay,bx,by,cx2,cy,col){
    ctx.fillStyle=col; ctx.beginPath();
    ctx.moveTo(ax|0,ay|0); ctx.lineTo(bx|0,by|0); ctx.lineTo(cx2|0,cy|0); ctx.closePath(); ctx.fill();
  }
  function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function clamp(v,a,b){ return v<a?a:v>b?b:v; }
  function smooth(a,b,x){ x=clamp((x-a)/(b-a),0,1); return x*x*(3-2*x); }

  // bulle de texte (PNJ / prompts) au-dessus d'un point
  function bubbleText(cx, bottomY, text, bg, fg){
    ctx.font='5px "Press Start 2P", monospace'; ctx.textAlign='center';
    const w = Math.max(ctx.measureText(text).width, 8);
    const pad=4, bw=w+pad*2, bh=10, bx=cx-bw/2, by=bottomY-bh;
    px(bx, by, bw, bh, bg||'rgba(36,23,52,.88)');
    px(bx, by, bw, 1, 'rgba(255,255,255,.25)');
    fillTri(cx-3, bottomY, cx+3, bottomY, cx, bottomY+4, bg||'rgba(36,23,52,.88)');
    ctx.fillStyle=fg||'#ffd166'; ctx.fillText(text, cx, by+7);
  }

  /* ======================================================================
     MOTEUR AUDIO : musique chiptune multi-pistes + bruitages
     ====================================================================== */
  const NOTE_BASE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  function midiOf(tok){
    const m=tok.match(/^([A-G])(#|b)?(-?\d)$/); if(!m) return null;
    const acc = m[2]==='#'?1 : m[2]==='b'?-1 : 0;
    return (parseInt(m[3])+1)*12 + NOTE_BASE[m[1]] + acc;
  }
  const freqOf = midi => 440*Math.pow(2,(midi-69)/12);
  function parseVoice(str){
    const out=[]; let step=0;
    for(const tk of str.trim().split(/\s+/)){
      const [n,d]=tk.split(':'); const dur=d?+d:1;
      if(n!=='R') out.push({step,dur,midi:midiOf(n)});
      step+=dur;
    }
    return out;
  }
  function buildTrack(bpm, parts){
    const voices = parts.map(p=>({notes:parseVoice(p.str), type:p.type, peak:p.peak}));
    let maxStep=0; for(const v of voices) for(const n of v.notes) maxStep=Math.max(maxStep,n.step+n.dur);
    const steps = Math.max(8, Math.ceil(maxStep/8)*8);
    const stepNotes = Array.from({length:steps},()=>[]);
    for(const v of voices) for(const n of v.notes)
      stepNotes[n.step%steps].push({type:v.type,midi:n.midi,dur:n.dur,peak:v.peak});
    return { bpm, steps, stepNotes };
  }

  const Audio = {
    ctx:null, master:null, sfxBus:null, noiseBuf:null,
    on:true, playing:false, track:null, step:0, nextTime:0, timer:null,
    init(){
      if(this.ctx) return;
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value=0;
      const lp=this.ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4200;
      this.master.connect(lp); lp.connect(this.ctx.destination);
      this.sfxBus=this.ctx.createGain(); this.sfxBus.gain.value=0.9; this.sfxBus.connect(this.ctx.destination);
    },
    setTrack(tr){
      if(this.track===tr) return;
      this.track = tr; this.step=0;
      if(this.playing && this.ctx) this.nextTime = this.ctx.currentTime + 0.05;
    },
    start(){
      if(!this.on) return;
      this.init(); this.ctx.resume();
      if(!this.playing){
        this.playing=true;
        this.master.gain.cancelScheduledValues(this.ctx.currentTime);
        this.master.gain.setValueAtTime(this.master.gain.value, this.ctx.currentTime);
        this.master.gain.linearRampToValueAtTime(0.5, this.ctx.currentTime+0.7);
        this.step=0; this.nextTime=this.ctx.currentTime+0.1;
        this.tick();
      }
    },
    stop(){
      this.playing=false; if(this.timer) clearTimeout(this.timer);
      if(this.master&&this.ctx){
        this.master.gain.cancelScheduledValues(this.ctx.currentTime);
        this.master.gain.linearRampToValueAtTime(0, this.ctx.currentTime+0.25);
      }
    },
    note(type,midi,t0,durSec,peak){
      if(midi==null) return;
      const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type; o.frequency.value=freqOf(midi);
      const atk=0.006, rel=0.05, hold=Math.max(0.04, durSec*0.86);
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(peak,t0+atk);
      g.gain.linearRampToValueAtTime(peak*0.65,t0+atk+0.05);
      g.gain.setValueAtTime(peak*0.65,t0+hold);
      g.gain.linearRampToValueAtTime(0,t0+hold+rel);
      o.connect(g); g.connect(this.master);
      o.start(t0); o.stop(t0+hold+rel+0.02);
    },
    tick(){
      if(!this.playing || !this.track){ this.timer=setTimeout(()=>this.tick(),40); return; }
      const eighth = 60/this.track.bpm/2;
      const lookahead=0.12;
      while(this.nextTime < this.ctx.currentTime + lookahead){
        for(const ev of this.track.stepNotes[this.step]) this.note(ev.type, ev.midi, this.nextTime, ev.dur*eighth, ev.peak);
        this.nextTime += eighth;
        this.step = (this.step+1) % this.track.steps;
      }
      this.timer = setTimeout(()=>this.tick(), 25);
    }
  };

  const TRACKS = {
    overworld: buildTrack(120, [
      {type:'square', peak:0.15, str:`
        G4 C5 E5 C5 G4 C5 E5 G5   F4 A4 C5 A4 F4 A4 C5 E5
        E4 G4 C5 G4 E4 G4 B4 D5   D4 G4 B4 D5 G5 D5 B4 G4`},
      {type:'square', peak:0.075, str:`
        E4 G4 C5 G4 E4 G4 C5 E5   C4 F4 A4 F4 C4 F4 A4 C5
        C4 E4 G4 E4 C4 E4 G4 B4   B3 D4 G4 B4 D5 B4 G4 D4`},
      {type:'triangle', peak:0.26, str:`
        C3:2 G2:2 C3:2 E3:2   F3:2 C3:2 F3:2 A3:2
        C3:2 G3:2 E3:2 G3:2   G3:2 D3:2 G3:2 B2:2`},
    ]),
    dragon: buildTrack(138, [
      {type:'square', peak:0.16, str:`
        D5 A4 F4 A4 D5 C5 A4 F4   G4 Bb4 D5 Bb4 G4 A4 Bb4 G4
        E5 D5 C5 G4 E5 G5 E5 C5   F5 A4 C5 A4 F5 E5 D5 C5
        Bb4 D5 F5 D5 Bb4 C5 D5 Bb4   G4 Bb4 E5 Bb4 G4 A4 Bb4 G4
        D5 F5 A5 F5 D5 C5 A4 F4   A4 C#5 E5 C#5 A4 B4 C#5 E5`},
      {type:'square', peak:0.085, str:`
        A3 D4 F4 D4 A3 D4 F4 D4   D4 G3 Bb3 G3 D4 G3 Bb3 D4
        G3 C4 E4 C4 G3 C4 E4 G4   C4 F3 A3 F3 C4 A3 F3 A3
        F3 Bb3 D4 Bb3 F3 Bb3 D4 F4   Bb3 E4 G4 E4 Bb3 G3 E4 G4
        A3 D4 F4 A4 F4 D4 A3 F3   E4 A3 C#4 A3 E4 G4 E4 C#4`},
      {type:'triangle', peak:0.26, str:`
        D3:2 A2:2 D3:2 F3:2   G2:2 D3:2 G2:2 Bb2:2
        C3:2 G2:2 C3:2 E3:2   F2:2 C3:2 F2:2 A2:2
        Bb2:2 F2:2 Bb2:2 D3:2   E2:2 Bb2:2 E2:2 G2:2
        D3:2 A2:2 F3:2 A2:2   A2:2 E3:2 A2:2 C#3:2`},
    ]),
    roller: buildTrack(158, [
      {type:'square', peak:0.15, str:`
        A4 A4 E5 A4 C5 C5 A4 C5   G4 G4 D5 G4 B4 B4 G4 B4
        F4 A4 C5 A4 E4 G4 B4 D5   A4 E5 A5 E5 C5 A4 E4 A4`},
      {type:'square', peak:0.07, str:`
        E4 E4 A4 E4 E4 E4 A4 E4   D4 D4 G4 D4 D4 D4 G4 D4
        C4 C4 F4 C4 B3 B3 E4 B3   E4 E4 A4 E4 A4 E4 C5 E4`},
      {type:'sawtooth', peak:0.16, str:`
        A2 A2 A3 A2 A2 A2 A3 A2   G2 G2 G3 G2 G2 G2 G3 G2
        F2 F2 F3 F2 E2 E2 E3 E2   A2 A2 A3 A2 A2 E3 A2 A2`},
    ]),
    cat: buildTrack(140, [
      {type:'square', peak:0.14, str:`
        E5 R G5 E5 C5 R E5 C5   D5 R F5 D5 B4 R D5 B4
        C5 E5 G5 E5 A4 C5 E5 C5   D5 B4 G4 B4 E5 D5 C5 B4`},
      {type:'square', peak:0.07, str:`
        C5 R E5 C5 G4 R C5 G4   G4 R B4 G4 D4 R G4 D4
        E4 G4 C5 G4 E4 A4 C5 A4   G4 D4 B3 D4 G4 G4 G4 G4`},
      {type:'triangle', peak:0.24, str:`
        A2:2 A2:2 E2:2 E2:2   G2:2 G2:2 D2:2 D2:2
        A2:2 C3:2 E3:2 C3:2   G2:2 D3:2 G2:2 G2:2`},
    ]),
  };

  // --- Bruitages partagés ---
  function sfxReady(){ return Audio.ctx && Audio.on && Audio.sfxBus; }
  function blip(f0,f1,dur,type,peak,delay){
    if(!sfxReady()) return;
    const t0=Audio.ctx.currentTime+(delay||0);
    const o=Audio.ctx.createOscillator(), g=Audio.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(peak,t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0006,t0+dur);
    o.connect(g); g.connect(Audio.sfxBus); o.start(t0); o.stop(t0+dur+0.03);
  }
  function getNoise(){
    if(!Audio.noiseBuf){
      const n=Math.floor(Audio.ctx.sampleRate*0.6);
      Audio.noiseBuf=Audio.ctx.createBuffer(1,n,Audio.ctx.sampleRate);
      const d=Audio.noiseBuf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    }
    return Audio.noiseBuf;
  }
  function noise(dur,peak,f0,f1,delay){
    if(!sfxReady()) return;
    const t0=Audio.ctx.currentTime+(delay||0);
    const s=Audio.ctx.createBufferSource(); s.buffer=getNoise();
    const bp=Audio.ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.9;
    bp.frequency.setValueAtTime(f0,t0);
    bp.frequency.exponentialRampToValueAtTime(Math.max(80,f1),t0+dur);
    const g=Audio.ctx.createGain();
    g.gain.setValueAtTime(peak,t0);
    g.gain.exponentialRampToValueAtTime(0.0006,t0+dur);
    s.connect(bp); bp.connect(g); g.connect(Audio.sfxBus); s.start(t0); s.stop(t0+dur+0.03);
  }
  // dragon
  function sfxCatch(){ blip(680,1180,0.10,'square',0.10); blip(1320,1760,0.09,'square',0.07,0.06); }
  function sfxFire(){ noise(0.34,0.14,1300,260); blip(330,90,0.30,'sawtooth',0.07); }
  function sfxFlee(){ blip(1500,820,0.12,'square',0.06); }
  function sfxHit(){ blip(240,70,0.26,'square',0.13); noise(0.12,0.08,600,140); }
  function sfxOrb(){ blip(420,180,0.14,'square',0.05); }
  function sfxBossAppear(){ blip(70,180,0.55,'sawtooth',0.12); blip(110,150,0.6,'square',0.05,0.05); noise(0.5,0.07,300,90); }
  function sfxBossHit(){ noise(0.12,0.16,2200,500); blip(500,240,0.12,'square',0.10); }
  function sfxBossDefeat(){ noise(0.5,0.16,1600,120); [880,660,523,440,330].forEach((f,i)=> blip(f,f*0.7,0.18,'square',0.10,i*0.09)); }
  // roller
  function sfxBoost(){ blip(300,900,0.18,'square',0.10); blip(600,1400,0.14,'square',0.06,0.05); }
  function sfxCrash(){ noise(0.4,0.2,500,90); blip(200,60,0.3,'sawtooth',0.12); }
  function sfxStar(){ blip(900,1500,0.08,'square',0.09); blip(1500,2100,0.07,'square',0.06,0.05); }
  function sfxWoosh(){ noise(0.18,0.05,800,1600); }
  // ville / chat
  function sfxHello(){ blip(520,780,0.08,'square',0.05); blip(780,620,0.08,'square',0.04,0.06); }
  function sfxMeow(){ blip(720,420,0.16,'sawtooth',0.08); blip(420,760,0.14,'sawtooth',0.06,0.12); }
  function sfxGrab(){ blip(500,1000,0.09,'square',0.09); blip(1000,1500,0.08,'triangle',0.06,0.05); }
  function sfxGiggle(){ blip(700,1100,0.07,'square',0.07); blip(1100,800,0.07,'square',0.06,0.06); blip(900,1300,0.06,'square',0.05,0.12); }
  function sfxWake(){ blip(120,300,0.5,'sawtooth',0.12); noise(0.4,0.08,400,120); blip(300,520,0.3,'square',0.06,0.1); }

  /* ======================================================================
     DESIGN DE VICTOR (lunettes + cheveux châtain) — repris du jeu du Dragon
     ====================================================================== */
  const KID = { skin:'#ffd9a8', skin2:'#ffcc99', hair:'#6b4423', hairHi:'#8a5d33',
                jumper:'#3aa0ff', jumper2:'#3477c4', scarf:'#ff5a5f', glass:'#241734', lens:'#bfe9ff' };

  // Victor de profil qui marche (overworld). dir:1 droite / -1 gauche.
  function drawVictor(x,y,dir,walk,moving){
    x|=0; y|=0;
    const s = moving ? Math.sin(walk) : 0;
    const la = s>0?2:0, lb = s>0?0:2;
    px(x-7,y+1,15,2,'rgba(0,0,0,.18)');                 // ombre
    // jambes (short + peau + chaussures)
    px(x-4,y-7,3,4,'#c79a52'); px(x+1,y-7,3,4,'#c79a52');// short
    px(x-4,y-3,3,3+la,KID.skin); px(x+1,y-3,3,3+lb,KID.skin);
    px(x-4,y+la,4,2,'#3a2a1a'); px(x+1,y+lb,4,2,'#3a2a1a');

    px(x+1,y-20,3,1,KID.glass); px(x+1,y-18,3,1,KID.glass); px(x+1,y-20,1,3,KID.glass); px(x+3,y-20,1,3,KID.glass);
    px(x,y-19,1,1,KID.glass);
    px(x-2,y-19,1,1,KID.glass); px(x+2,y-19,1,1,KID.glass);

  // Céleste vu de dessus (jeu du chat). dir: 'N''S''E''W'
  function drawCelesteTop(x,y,dir,t){
    x|=0;y|=0;
    px(x-6,y+5,12,3,'rgba(0,0,0,.18)');
    px(x-5,y-3,10,9,'#7fc7e8'); px(x-5,y-3,10,2,'#a7ddf5');  // corps

  /* ======================================================================
     GESTION DES SCÈNES / MODES
     ====================================================================== */
  let mode = 'home';
  let currentGame = null;
  const games = {};
  let pendingTownReturn = false;

  const FIRE_H = 16, PLAY_BOTTOM = VH - FIRE_H, PLAY_TOP = 46;

  const rotateEl = document.getElementById('rotate');
  function isPhone(){ return Math.min(window.innerWidth,window.innerHeight) < 560 && ('ontouchstart' in window); }
  function checkOrientation(){
    const portrait = window.innerHeight > window.innerWidth;
    rotateEl.classList.toggle('show', mode==='play' && isPhone() && portrait);

  /* ======================================================================
     OVERWORLD : une ville au pied d'une montagne, en été.
     Parcours : ville (PNJ qui disent bonjour) -> montée -> sommet (dragon)
     -> début de descente (rollers). 3 défis déclenchés le long du chemin.
     ====================================================================== */
  const overworld = (() => {
    const WORLD_W = 1360, X_MIN = 30, X_MAX = 1320;
    const TOWN_END = 520, SUMMIT_X = 1180;
    const SPAWN = 200;

    const triggers = [
      { wx:560,  game:'cat',    label:'ATTRAPER LE CHAT' },
      { wx:1180, game:'dragon', label:'RÉVEILLER LE DRAGON' },
      { wx:1300, game:'roller', label:'DESCENDRE À ROLLERS' },
    ];
    let victor, camX, camY, walk, heldDir, tEnv, near;
    let clouds, houses, townTrees, npcs, firs, rocks, flowers, inited=false;

    function groundY(wx){
      if(wx<=TOWN_END) return 280;
      if(wx>=SUMMIT_X) return wx>1260 ? 60 + Math.min(34,(wx-1260)*0.34) : 60;
      return 280 - smooth(TOWN_END, SUMMIT_X, wx)*220;
    }

    function init(){
      victor = { wx:SPAWN, dir:1 };
      walk=0; heldDir=0; tEnv=0; near=null;
      recamera(true);
      clouds=[]; for(let i=0;i<7;i++) clouds.push({x:Math.random()*WORLD_W, y:8+Math.random()*32, w:14+Math.random()*16, s:0.1+Math.random()*0.18});
      houses=[
        {wx:70,kind:'house',col:'#f0d9b5',roof:'#c0492f'},
        {wx:140,kind:'flat',col:'#cdb9a0'},
        {wx:215,kind:'house',col:'#e7e0c8',roof:'#3f7e8c'},
        {wx:300,kind:'flat',col:'#d8c4b0'},
        {wx:380,kind:'house',col:'#f3e1c0',roof:'#8a5a3a'},
        {wx:455,kind:'house',col:'#e9d2bd',roof:'#5a7a4a'},
      ];
      townTrees=[]; for(const wx of [40,110,180,260,340,420,495]) townTrees.push({wx});
      npcs=[
        {wx:110, col:'#c0492f', line:'Bonjour !'},
        {wx:235, col:'#3f7e8c', line:'Salut Victor !'},
        {wx:335, col:'#8a5a3a', line:'Belle journée !'},
        {wx:440, col:'#5a7a4a', line:'Bonne balade !'},
      ];
      firs=[]; for(let i=0;i<26;i++){ const wx=600+i*22+rnd(-6,6); firs.push({wx, s:0.8+Math.random()*0.5}); }
      rocks=[]; for(let i=0;i<16;i++){ const wx=600+Math.random()*560; rocks.push({wx, s:0.7+Math.random()*0.7}); }
      flowers=[]; for(let i=0;i<60;i++){ const wx=540+Math.random()*640; flowers.push({wx, c:['#ff5a8a','#ffd166','#fff','#b07ddb'][rnd(0,3)]}); }
      inited=true;
    }
    function placeInTown(){ victor.wx=SPAWN; victor.dir=1; recamera(true); }
    function recamera(snap){
      const tx = clamp(victor.wx - VW/2, 0, WORLD_W-VW);
      const ty = groundY(victor.wx) - 120;
      if(snap){ camX=tx; camY=ty; } else { camX += (tx-camX)*0.18; camY += (ty-camY)*0.18; }
    }
    function enter(){ if(!inited) init(); }

    function update(dt){
      tEnv += dt;
      if(mode==='overworld' && heldDir!==0){
        victor.wx = clamp(victor.wx + heldDir*66*dt, X_MIN, X_MAX);
        victor.dir = heldDir>0?1:-1; walk += dt*11;
      }
      recamera(false);
      near=null;
      for(const tg of triggers){ if(Math.abs(victor.wx-tg.wx)<46){ near=tg; break; } }
      for(const c of clouds){ c.x -= c.s*8*dt; if(c.x<-30) c.x=WORLD_W+20; }
    }

    function sx(wx){ return wx - camX; }
    function sy(wx){ return groundY(wx) - camY; }

    function render(){
      // ciel
      const g=ctx.createLinearGradient(0,0,0,VH);
      g.addColorStop(0,'#8ed1f0'); g.addColorStop(0.6,'#bfe6f7'); g.addColorStop(1,'#e6f6ff');
      ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
      px(28,16,16,16,'#fff4cf'); px(30,18,12,12,'#ffe08a'); px(32,20,8,8,'#ffd166');
      // montagnes lointaines (été, vertes/bleutées) + neige au sommet
      bgRange(-camX*0.12 - camY*0.15, 96, 30, '#9fc0d8', '#fff');
      bgRange(-camX*0.24 - camY*0.25, 110, 40, '#7ea66a', '#dfeecb');
      for(const c of clouds){ const x=c.x-camX*0.4; if(x>-30&&x<VW+30) drawCloud(x, c.y, c.w); }
      // sol (polygone qui suit le relief)
      ctx.beginPath(); ctx.moveTo(0,VH);
      for(let s=0;s<=VW;s+=4){ ctx.lineTo(s, groundY(s+camX)-camY); }
      ctx.lineTo(VW,VH); ctx.closePath();
      ctx.fillStyle='#79bf57'; ctx.fill();
      // liseré + texture
      ctx.strokeStyle='#5aa84f'; ctx.lineWidth=2; ctx.beginPath();
      for(let s=0;s<=VW;s+=4){ const yy=groundY(s+camX)-camY; if(s===0) ctx.moveTo(s,yy); else ctx.lineTo(s,yy); }
      ctx.stroke();
      // route/trottoir en ville
      for(let s=0;s<=VW;s+=6){ const wx=s+camX; if(wx<=TOWN_END+10){ const yy=groundY(wx)-camY; px(s,yy+10,6,3,'#c9b48f'); } }
      // chemin de terre sur la montée
      for(let s=0;s<=VW;s+=6){ const wx=s+camX; if(wx>TOWN_END&&wx<SUMMIT_X+40){ const yy=groundY(wx)-camY; px(s,yy+5,6,4,'#caa46a'); } }

      // décor montagne (derrière)
      for(const f of firs){ const x=sx(f.wx); if(x>-30&&x<VW+30) drawFir(x, sy(f.wx), f.s); }
      for(const r of rocks){ const x=sx(r.wx); if(x>-30&&x<VW+30) drawRock(x, sy(r.wx), r.s); }
      for(const fl of flowers){ const x=sx(fl.wx); if(x>-10&&x<VW+10) { const yy=sy(fl.wx); px(x,yy-2,1,2,'#3f7e36'); px(x-1,yy-3,3,2,fl.c); px(x,yy-2,1,1,'#ffd166'); } }

      // ville
      for(const t of townTrees){ const x=sx(t.wx); if(x>-30&&x<VW+30) drawTownTree(x, sy(t.wx)); }
      for(const h of houses){ const x=sx(h.wx); if(x>-50&&x<VW+50) drawBuilding(x, sy(h.wx), h); }
      for(const n of npcs){ const x=sx(n.wx); if(x>-30&&x<VW+30) drawNPC(x, sy(n.wx), n); }

      // éléments des défis
      drawCatTrigger(sx(560), sy(560));
      drawDragonTrigger(sx(1180), sy(1180));
      drawRollerSign(sx(1300), sy(1300));

      // Victor
      drawVictor(sx(victor.wx), 120, victor.dir, walk, mode==='overworld'&&heldDir!==0);

      // infobulles des passants quand on est proche
      for(const n of npcs){ if(Math.abs(victor.wx-n.wx)<48){ bubbleText(sx(n.wx), sy(n.wx)-34, n.line); } }

      drawHUD();
    }

    function bgRange(off, baseY, h, col, snow){
      const spacing=70; const phase=((off%spacing)+spacing)%spacing;
      for(let i=-1;i<=VW/spacing+2;i++){
        const cx=(i*spacing+phase)|0; const peakH=h+((i*7+13)%5)*4;
        fillTri(cx, baseY-peakH, cx-spacing*0.7, baseY, cx+spacing*0.7, baseY, col);
        fillTri(cx, baseY-peakH, cx-peakH*0.3, baseY-peakH*0.55, cx+peakH*0.3, baseY-peakH*0.55, snow);
      }
    }
    function drawCloud(x,y,w){ x|=0;y|=0;
      ctx.fillStyle='rgba(255,255,255,.95)';
      ctx.fillRect(x,y,w,4); ctx.fillRect(x+3,y-3,w-6,4); ctx.fillRect(x+6,y-5,w-14,4);
    }
    function drawFir(x,y,s){ x|=0;y|=0; const H=18*s;
      px(x-1,y-3,2,3,'#6b4423');
      fillTri(x, y-H*0.55, x-7*s, y-2, x+7*s, y-2, '#2f7a4a');
      fillTri(x, y-H*0.85, x-5*s, y-H*0.4, x+5*s, y-H*0.4, '#3a8a55');
      fillTri(x, y-H, x-3*s, y-H*0.7, x+3*s, y-H*0.7, '#46a062');
    }
    function drawRock(x,y,s){ x|=0;y|=0; ctx.fillStyle='#9a9a9a'; circleFill(x,y-3*s,5*s); ctx.fillStyle='#b5b5b5'; circleFill(x-1,y-4*s,3*s); px(x-5*s,y-1,10*s,2,'#7e7e7e'); }
    function drawTownTree(x,y){ x|=0;y|=0; px(x-1,y-12,3,12,'#7a5b3a'); ctx.fillStyle='#4f9646'; circleFill(x,y-17,8); ctx.fillStyle='#67b057'; circleFill(x-2,y-19,4); }
    function drawBuilding(x,y,h){ x|=0;y|=0;
      if(h.kind==='flat'){
        px(x-16,y-46,32,46,h.col); px(x-16,y-46,32,3,'#fff6e6');
        for(let wy=y-42; wy<y-6; wy+=8) for(let wx=x-12; wx<x+12; wx+=8) px(wx,wy,5,5,'#bfe2ef');
        px(x-5,y-10,10,10,'#7a5b3a');
      } else {
        px(x-18,y-26,36,26,h.col);
        fillTri(x, y-44, x-22, y-26, x+22, y-26, h.roof);
        px(x-6,y-16,12,16,'#7a5b3a'); px(x-4,y-14,8,12,'#9b7a52'); px(x+2,y-8,1,1,'#ffd166');
        px(x-15,y-22,8,8,'#bfe2ef'); px(x+7,y-22,8,8,'#bfe2ef');
      }
    }
    function drawNPC(x,y,n){ x|=0;y|=0;
      const wob=Math.sin(tEnv*3+n.wx)*1;
      px(x-7,y+1,14,2,'rgba(0,0,0,.18)');
      px(x-3,y-6,3,6,'#46506a'); px(x+1,y-6,3,6,'#46506a');          // jambes
      px(x-4,y-14,9,8,n.col);                                        // corps
      px(x-3,y-21,7,7,'#ffd9a8');                                    // tête
      px(x-4,y-23,9,3,'#3a2a1a');                                    // cheveux
      px(x-2,y-19,1,1,'#241734'); px(x+1,y-19,1,1,'#241734');
      // bras qui salue
      px(x+5,y-15-wob,2,5,n.col); px(x+5,y-17-Math.max(0,wob),2,2,'#ffd9a8');
    }
    function drawCatTrigger(x,y){ x|=0;y|=0;
      // bébé Céleste assis qui montre le chat
      drawCeleste(x, y-12);
      bubbleText(x+2, y-24, 'Chat !', 'rgba(36,23,52,.9)', '#ffd84a');
      // petit chat noir qui file
      const cx=x+24+Math.sin(tEnv*2)*4;
      px(cx-4,y-4,9,5,'#1f1f28'); px(cx-4,y-7,3,3,'#1f1f28'); px(cx+4,y-3,3,2,'#1f1f28');
      px(cx-3,y-6,1,1,'#ffd84a'); px(cx,y-6,1,1,'#ffd84a');
    }
    function drawDragonTrigger(x,y){ x|=0;y|=0;
      // dragon endormi, en boule, qui ronfle
      px(x-22,y-2,44,3,'rgba(0,0,0,.18)');
      ctx.fillStyle='#d62246'; circleFill(x,y-8,15);
      ctx.fillStyle='#e63946'; circleFill(x-2,y-10,11);
      px(x-20,y-6,10,6,'#d62246');                                   // queue repliée
      px(x+8,y-12,12,9,'#d62246');                                   // tête posée
      px(x+9,y-11,10,3,'#ff6b74');
      px(x+11,y-9,3,1,'#7a0c19'); px(x+16,y-9,3,1,'#7a0c19');        // yeux fermés
      // ailes repliées
      px(x-6,y-18,12,8,'#b3122a'); px(x-4,y-16,8,5,'#e63946');
      // Zzz
      const zf=Math.floor(tEnv*2)%3;
      ctx.font='6px "Press Start 2P", monospace'; ctx.textAlign='left'; ctx.fillStyle='#fff';
      ctx.fillText('z'.repeat(1+zf).toUpperCase(), x+18, y-18-zf*3);
    }
    function drawRollerSign(x,y){ x|=0;y|=0;
      px(x-1,y-18,2,18,'#7a5b3a');
      px(x-14,y-30,28,13,'#ffd166'); px(x-14,y-30,28,2,'#fff3b0');
      ctx.font='6px "Press Start 2P", monospace'; ctx.textAlign='center'; ctx.fillStyle='#7a4a00';
      ctx.fillText('↓', x, y-21);
      // petit roller posé
      px(x+10,y-4,8,3,'#2a6ad6'); px(x+10,y-1,1,1,'#ffd166'); px(x+14,y-1,1,1,'#ffd166');
    }

    const BTN = { left:{x:6,y:148,w:40,h:26}, right:{x:274,y:148,w:40,h:26}, enter:{x:108,y:150,w:104,h:22} };
    function drawHUD(){
      drawArrow(BTN.left,'◀'); drawArrow(BTN.right,'▶');
      if(near){
        const b=BTN.enter; const pulse=Math.floor(tEnv*4)%2;
        px(b.x,b.y,b.w,b.h, pulse?'#2a9d6f':'#1f7a52'); px(b.x,b.y,b.w,2,'#7ee0c0');
        ctx.font='8px "Press Start 2P", monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillStyle='#fff'; ctx.fillText('JOUER ▶', b.x+b.w/2, b.y+b.h/2+1); ctx.textBaseline='alphabetic';
        // étiquette du défi
        bubbleText(sx(near.wx), sy(near.wx)-44, near.label, 'rgba(36,23,52,.9)', '#ffd166');
      }
      const loc = victor.wx<TOWN_END ? 'LA VILLE' : victor.wx<SUMMIT_X ? "L'ASCENSION" : 'LE SOMMET';
      ctx.font='6px "Press Start 2P", monospace'; ctx.textAlign='center';
      px(VW/2-44, 4, 88, 11, 'rgba(36,23,52,.55)');
      ctx.fillStyle='#fff'; ctx.fillText(loc, VW/2, 12);
    }
    function drawArrow(b,glyph){
      px(b.x,b.y,b.w,b.h,'rgba(36,23,52,.55)'); px(b.x,b.y,b.w,2,'rgba(255,255,255,.25)');
      ctx.font='12px "Press Start 2P", monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#ffd166'; ctx.fillText(glyph, b.x+b.w/2, b.y+b.h/2+1); ctx.textBaseline='alphabetic';
    }
    function hit(b,p){ return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h; }
    function onDown(p){
      if(hit(BTN.left,p)){ heldDir=-1; return; }
      if(hit(BTN.right,p)){ heldDir=1; return; }
      if(near){ if(hit(BTN.enter,p) || (Math.abs(sx(near.wx)-p.x)<26 && p.y<130)) { enterGame(near.game); return; } }
    }
    function onMove(p){
      if(hit(BTN.left,p)) heldDir=-1; else if(hit(BTN.right,p)) heldDir=1; else heldDir=0;
    }
    function onUp(){ heldDir=0; }
    function onKey(k,down){
      if(k==='ArrowLeft') heldDir=down?-1:0;
      else if(k==='ArrowRight') heldDir=down?1:0;
      else if(down&&(k==='Enter'||k===' ')&&near) enterGame(near.game);
    }
    return { init, enter, update, render, onDown, onMove, onUp, onKey, placeInTown };
  })();

  /* ======================================================================
     JEU 1 — VICTOR & LE DRAGON (calcul mental)
     ====================================================================== */
  const dragon = (() => {
    const OPS = [ {sym:'+',name:'Addition'},{sym:'−',name:'Soustraction'},{sym:'×',name:'Multiplication'},{sym:'÷',name:'Division'} ];
    function opsNeeded(){ return level<2?3:5; }
    const BOSS_PALETTES = [

     ====================================================================== */
  const catmaze = (() => {
    const COLS=9, ROWS=5, CW=32, CH=28, X0=16, Y0=30;
    const DIRS={ N:[0,-1,'S'], S:[0,1,'N'], E:[1,0,'W'], W:[-1,0,'E'] };
    let cells, player, cat, timer, score, t, shake, flash, caughtFx, best;

    function enter(){ reset(); }
    function reset(){
      genMaze();
      player=mkAgent(0,ROWS-1);
      cat=mkAgent(COLS-1,0); cat.speed=70;
      player.speed=96;
      timer=22; score=0; t=0; shake=0; flash=null; caughtFx=0;
    }
    function mkAgent(c,r){ const ce=cell(c,r); return { c, r, x:ce.x, y:ce.y, dir:null, nextDir:null, moving:false, tx:ce.x, ty:ce.y, speed:90 }; }
    function cell(c,r){ return { x:X0+c*CW+CW/2, y:Y0+r*CH+CH/2 }; }

    function genMaze(){
      cells=[]; for(let r=0;r<ROWS;r++){ cells[r]=[]; for(let c=0;c<COLS;c++) cells[r][c]={N:1,E:1,S:1,W:1,v:0}; }
      let c=0,r=0; cells[0][0].v=1; let visited=1; const total=COLS*ROWS; const stack=[];
      while(visited<total){
        const nb=[];
        for(const d in DIRS){ const [dx,dy]=DIRS[d]; const nc=c+dx,nr=r+dy; if(nc>=0&&nc<COLS&&nr>=0&&nr<ROWS&&!cells[nr][nc].v) nb.push([d,nc,nr]); }
        if(nb.length){ const [d,nc,nr]=nb[rnd(0,nb.length-1)]; cells[r][c][d]=0; cells[nr][nc][DIRS[d][2]]=0; stack.push([c,r]); c=nc; r=nr; cells[r][c].v=1; visited++; }
        else { const pc=stack.pop(); c=pc[0]; r=pc[1]; }
      }
      // tressage : on ouvre quelques culs-de-sac pour permettre la poursuite
      for(let r2=0;r2<ROWS;r2++) for(let c2=0;c2<COLS;c2++){
        const ce=cells[r2][c2]; if(ce.N+ce.E+ce.S+ce.W>=3 && Math.random()<0.55){
          const opts=[]; if(r2>0&&ce.N) opts.push('N'); if(r2<ROWS-1&&ce.S) opts.push('S'); if(c2>0&&ce.W) opts.push('W'); if(c2<COLS-1&&ce.E) opts.push('E');
          if(opts.length){ const d=opts[rnd(0,opts.length-1)]; const [dx,dy,opp]=DIRS[d]; ce[d]=0; cells[r2+dy][c2+dx][opp]=0; }
        }
      }
    }
    function canMove(c,r,d){ if(!DIRS[d]) return false; if(cells[r][c][d]) return false; const [dx,dy]=DIRS[d]; const nc=c+dx,nr=r+dy; return nc>=0&&nc<COLS&&nr>=0&&nr<ROWS; }

    function stepAgent(a,dt,chooseDir){
      if(a.moving){
        const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
        const adv=a.speed*dt;
        if(d<=adv){ a.x=a.tx; a.y=a.ty; a.moving=false; const [ddx,ddy]=DIRS[a.dir]; a.c+=ddx; a.r+=ddy; }
        else { a.x+=dx/d*adv; a.y+=dy/d*adv; }
      }
      if(!a.moving){
        const want=chooseDir(a);
        let d=null;
        if(want&&canMove(a.c,a.r,want)) d=want;
        else if(a.dir&&canMove(a.c,a.r,a.dir)) d=a.dir;
        if(d){ a.dir=d; const [dx,dy]=DIRS[d]; const ce=cell(a.c+dx,a.r+dy); a.tx=ce.x; a.ty=ce.y; a.moving=true; }
        else a.dir=null;
      }
    }

    function catChoose(a){
      if(a.moving) return a.nextDir;
      const opts=[]; for(const d in DIRS) if(canMove(a.c,a.r,d)) opts.push(d);
      if(!opts.length) return null;
      const back = a.dir? DIRS[a.dir][2] : null;
      let pool=opts.filter(d=>d!==back); if(!pool.length) pool=opts;
      let pick;
      if(Math.random()<0.28) pick=pool[rnd(0,pool.length-1)];
      else { let bestD=pool[0], bestS=-1; for(const d of pool){ const [dx,dy]=DIRS[d]; const s=Math.abs((a.c+dx)-player.c)+Math.abs((a.r+dy)-player.r); if(s>bestS){bestS=s;bestD=d;} } pick=bestD; }
      a.nextDir=pick; return pick;
    }
    function farCell(){ let bc=0,br=0,bs=-1; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const s=Math.abs(c-player.c)+Math.abs(r-player.r); if(s>bs){bs=s;bc=c;br=r;} } return {c:bc,r:br}; }

    function update(dt){
      t+=dt; if(shake>0) shake=Math.max(0,shake-dt*12); if(caughtFx>0) caughtFx-=dt;
      timer-=dt; if(timer<=0){ timer=0; gameOver('cat',score); return; }
      stepAgent(player,dt,a=>a.nextDir);
      stepAgent(cat,dt,catChoose);
      if(flash){ flash.life-=dt; if(flash.life<=0) flash=null; }
      // capture
      if(Math.hypot(player.x-cat.x, player.y-cat.y) < 11){
        score++; timer=Math.min(30,timer+5); caughtFx=0.5; sfxGrab(); sfxMeow(); if(score%3===0) sfxGiggle();
        flash={x:cat.x,y:cat.y-14,txt:'ATTRAPÉ !',life:0.9};
        const f=farCell(); cat.c=f.c; cat.r=f.r; const ce=cell(f.c,f.r); cat.x=ce.x; cat.y=ce.y; cat.moving=false; cat.dir=null; cat.nextDir=null;
        cat.speed=Math.min(104, cat.speed+3.5);
      }
    }

    function render(){
      ctx.save(); let sx=0,sy=0; if(shake>0){ sx=(Math.random()-0.5)*shake; sy=(Math.random()-0.5)*shake; } ctx.translate(sx,sy);
      // pelouse de fond
      px(0,0,VW,VH,'#8fce6a'); for(let i=0;i<VW;i+=10) px(i,VH-6,5,2,'#79bf57');
      // labyrinthe de haies de bocage
      drawMaze();
      drawCatTop(cat.x,cat.y,cat.dir||'S',t);
      drawCelesteTop(player.x,player.y,player.dir||'S',t);
      if(caughtFx>0){ ctx.globalAlpha=caughtFx; ctx.fillStyle='#fff'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1; }
      if(flash){ ctx.globalAlpha=clamp(flash.life,0,1); ctx.fillStyle='#fff'; ctx.font='8px "Press Start 2P", monospace'; ctx.textAlign='center'; ctx.fillText(flash.txt,flash.x,flash.y); ctx.globalAlpha=1; }
      ctx.restore(); drawHUD();
    }
    function hedge(x,y,w,h){ px(x,y,w,h,'#2f7a3a'); px(x,y,w,2,'#3f9a4a'); for(let i=0;i<w;i+=3) for(let j=0;j<h;j+=3) if(((i+j)>>1)%2) px(x+i,y+j,1,1,'#256430'); }
    function drawMaze(){
      const TH=4;
      // bordure
      px(X0-TH,Y0-TH,COLS*CW+TH*2,TH,'#2f7a3a'); px(X0-TH,Y0+ROWS*CH,COLS*CW+TH*2,TH,'#2f7a3a');
      px(X0-TH,Y0-TH,TH,ROWS*CH+TH*2,'#2f7a3a'); px(X0+COLS*CW,Y0-TH,TH,ROWS*CH+TH*2,'#2f7a3a');
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
        const cx=X0+c*CW, cy=Y0+r*CH; const ce=cells[r][c];
        if(ce.N) hedge(cx, cy-TH/2, CW+TH, TH);
        if(ce.W) hedge(cx-TH/2, cy, TH, CH+TH);
      }
      // texture feuillage bordure haut
      ctx.fillStyle='#3f9a4a';
    }
    function drawHUD(){
      // chrono
      px(6,6,VW-12,8,'rgba(20,12,40,.4)');
      const frac=clamp(timer/30,0,1); const col=timer<6?(Math.floor(t*8)%2?'#ff3b3b':'#ffae00'):'#2a9d6f';
      px(6,6,Math.floor((VW-12)*frac),8,col); px(6,6,Math.floor((VW-12)*frac),2,'rgba(255,255,255,.3)');
      ctx.font='6px "Press Start 2P", monospace'; ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.fillText('TEMPS '+Math.ceil(timer),9,12.5);
      ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.fillText('CHATS '+score, VW-9, 12.5);
      // mini d-pad indicatif
      ctx.globalAlpha=0.5; ctx.fillStyle='#173a4a'; ctx.font='5px "Press Start 2P", monospace'; ctx.textAlign='center';
      ctx.fillText('TAPE AUTOUR DE CÉLESTE POUR LE DIRIGER', VW/2, VH-3); ctx.globalAlpha=1;
    }
    function setDirFromPoint(p){
      const dx=p.x-player.x, dy=p.y-player.y;
      if(Math.abs(dx)>Math.abs(dy)) player.nextDir = dx>0?'E':'W';
      else player.nextDir = dy>0?'S':'N';
    }
    function onDown(p){ setDirFromPoint(p); } function onMove(p){ if(p) setDirFromPoint(p); } function onUp(){}
    function onKey(k,down){ if(!down) return; if(k==='ArrowLeft') player.nextDir='W'; else if(k==='ArrowRight') player.nextDir='E'; else if(k==='ArrowUp') player.nextDir='N'; else if(k==='ArrowDown') player.nextDir='S'; }
    return { enter, update, render, onDown, onMove, onUp, onKey, bestKey:'victor_cat_best' };
  })();

  games.dragon=dragon; games.roller=roller; games.cat=catmaze;

  /* ======================================================================
     OVERLAYS + navigation
     ====================================================================== */
  const overlay=document.getElementById('overlay');
  const el=id=>document.getElementById(id);
  const ovBadge=el('ovBadge'),ovTitle=el('ovTitle'),ovSub=el('ovSub'),ovHow=el('ovHow');
  const ovScore=el('ovScore'),ovBest=el('ovBest'),ovPrimary=el('ovPrimary'),ovSecondary=el('ovSecondary'),ovCredit=el('ovCredit');

  const GAME_INFO = {
    cat: {
      badge:'★ DÉFI : LE CHAT ★', title:'ATTRAPE<br><span class="red">LE CHAT</span>',
      sub:"Céleste a vu un chat noir ! Aide-le à l'attraper dans le labyrinthe de haies avant la fin du temps.",
      how:[
        ['👶',"Tu contrôles le petit Céleste"],
        ['👆',"Tape autour de lui pour choisir la direction"],
        ['🐈‍⬛',"Coince le chat noir dans les haies"],
        ['⏱️',"Chaque chat attrapé rajoute du temps"],
        ['🏁',"Attrape-en le plus possible avant la fin !"],
      ],
    },
    dragon: {
      badge:'★ DÉFI : LE DRAGON ★', title:'VICTOR &amp; LE<br><span class="red">DRAGON</span>',
      sub:"Le dragon du sommet s'est réveillé ! Lis l'opération et attrape la bulle avec la BONNE réponse.",
      how:[
        ['👆',"Glisse pour diriger le dragon"],
        ['🫧',"Attrape la bulle avec la <b>bonne</b> réponse"],
        ['🚫',"Évite les mauvaises réponses"],
        ['🔥',"Jauge pleine → tape la barre du bas pour cracher du feu"],
        ['🐲',"Bats le dragon ennemi entre les niveaux"],
      ],
    },
    roller: {
      badge:'★ DÉFI : LA DESCENTE ★', title:'LA DESCENTE<br><span class="red">FOLLE</span>',
      sub:"Pour redescendre la montagne, dévale la piste en roller ! Glisse pour slalomer. Ça accélère tout seul.",
      how:[
        ['👈',"Glisse à gauche / à droite pour te déplacer"],
        ['🚩',"Passe entre les portes pour des points"],
        ['🌲',"Évite sapins, rochers, vaches… et plus bizarre !"],
        ['💩',"La boue et les flaques te font déraper"],
        ['⛰️',"Plus tu descends, plus c'est rapide et fou !"],
      ],
    },
  };

  function setHow(list){ ovHow.innerHTML=list.map(([ic,txt])=>`<div><span class="ic">${ic}</span> ${txt}</div>`).join(''); ovHow.classList.remove('gone'); }
  function showOverlay(){ overlay.classList.remove('gone'); }
  function hideOverlay(){ overlay.classList.add('gone'); }

  function showHome(){
    showOverlay();
    ovBadge.textContent='★ Un été à la montagne ★';
    ovTitle.innerHTML='LES AVENTURES<br>DE <span class="red">VICTOR</span>';
    ovSub.innerHTML="Promène-toi dans la ville, grimpe la montagne et relève les 3 défis qui t'attendent sur le chemin !";
    setHow([
      ['🚶',"Marche avec ◀ ▶ et dis bonjour aux gens"],
      ['🐈‍⬛',"Au pied de la montagne : attrape le chat avec Céleste"],
      ['🐲',"Au sommet : réveille le dragon (calcul mental)"],
      ['🛼',"Pour redescendre : la descente folle en roller !"],
    ]);
    ovScore.classList.add('gone'); ovBest.classList.add('gone'); ovSecondary.classList.add('gone'); ovCredit.classList.remove('gone');
    ovTitle.style.fontSize='';
    ovPrimary.textContent='JOUER ▶';
    ovPrimary.onclick=()=>{ Audio.on&&Audio.start(); goOverworld(); goFullscreenLandscape(); };
  }
  function showIntro(game){
    const info=GAME_INFO[game]; showOverlay();
    ovBadge.textContent=info.badge; ovTitle.innerHTML=info.title; ovTitle.style.fontSize=''; ovSub.innerHTML=info.sub; setHow(info.how);
    ovScore.classList.add('gone'); ovBest.classList.add('gone'); ovCredit.classList.add('gone');
    ovPrimary.textContent='JOUER ▶'; ovPrimary.onclick=()=>playGame();
    ovSecondary.classList.remove('gone'); ovSecondary.textContent='◀ CARTE'; ovSecondary.onclick=()=>goOverworld();
  }
  function showOver(game,score,best){
    const info=GAME_INFO[game]; showOverlay();
    ovBadge.textContent='PARTIE TERMINÉE'; ovTitle.innerHTML=info.title; ovTitle.style.fontSize='clamp(16px,4vw,28px)';
    ovSub.innerHTML=(score>=best&&score>0)?'🎉 Nouveau record !':'Bien joué !';
    ovHow.classList.add('gone'); ovScore.classList.remove('gone'); ovBest.classList.remove('gone'); ovCredit.classList.add('gone');
    ovScore.textContent=(game==='roller'?'Distance : ':game==='cat'?'Chats : ':'Score : ')+score;
    ovBest.textContent='Record : '+best;
    ovPrimary.textContent='REJOUER ↻'; ovPrimary.onclick=()=>playGame();
    ovSecondary.classList.remove('gone'); ovSecondary.textContent='◀ CARTE'; ovSecondary.onclick=()=>goOverworld();
  }

  function goOverworld(){
    overworld.enter();
    if(pendingTownReturn){ overworld.placeInTown(); pendingTownReturn=false; }
    mode='overworld'; hideOverlay(); Audio.setTrack(TRACKS.overworld); checkOrientation();
  }
  function enterGame(game){ currentGame=game; mode='intro'; Audio.setTrack(TRACKS[game]); showIntro(game); checkOrientation(); }
  function playGame(){ const g=currentGame; mode='play'; hideOverlay(); Audio.setTrack(TRACKS[g]); Audio.on&&Audio.start(); games[g].enter(); checkOrientation(); }
  function gameOver(game,score){
    mode='over';
    const bk=games[game].bestKey; let best=+(localStorage.getItem(bk)||0); if(score>best){ best=score; localStorage.setItem(bk,best); }
    if(game==='roller') pendingTownReturn=true;
    showOver(game,score,best); rotateEl.classList.remove('show');
  }
  window.__gameOver=gameOver;

  /* ======================================================================
     ENTRÉES
     ====================================================================== */
  function toBuf(cx,cy){ return { x:(cx-offX)/scale, y:(cy-offY)/scale }; }
  function activeScene(){ if(mode==='play') return games[currentGame]; if(mode==='overworld') return overworld; return null; }
  display.addEventListener('pointerdown', e=>{ e.preventDefault(); const s=activeScene(); if(s) s.onDown(toBuf(e.clientX,e.clientY)); }, {passive:false});
  display.addEventListener('pointermove', e=>{ if(e.pressure>0||e.buttons>0){ const s=activeScene(); if(s&&s.onMove) s.onMove(toBuf(e.clientX,e.clientY)); } }, {passive:false});
  display.addEventListener('pointerup', e=>{ const s=activeScene(); if(s&&s.onUp) s.onUp(toBuf(e.clientX,e.clientY)); }, {passive:false});
  display.addEventListener('pointercancel', ()=>{ const s=activeScene(); if(s&&s.onUp) s.onUp({x:0,y:0}); });
  window.addEventListener('keydown', e=>{ if(e.key==='m'||e.key==='M'){ toggleMute(); return; } const s=activeScene(); if(s&&s.onKey) s.onKey(e.key,true); });
  window.addEventListener('keyup', e=>{ const s=activeScene(); if(s&&s.onKey) s.onKey(e.key,false); });

  /* ======================================================================
     BOUCLE PRINCIPALE
     ====================================================================== */
  let last=performance.now();
  function frame(now){
    requestAnimationFrame(frame);
    let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05;
    if(mode==='play') games[currentGame].update(dt); else overworld.update(dt);
    const showGame=(mode==='play'||mode==='over');
    (showGame?games[currentGame]:overworld).render();
    dctx.fillStyle='#0d1b2a'; dctx.fillRect(0,0,window.innerWidth,window.innerHeight);
    dctx.drawImage(buf, offX, offY, VW*scale, VH*scale);
  }

  /* ======================================================================
     AUDIO mute + plein écran
     ====================================================================== */
  const muteBtn=document.getElementById('muteBtn');
  function toggleMute(){ Audio.on=!Audio.on; muteBtn.textContent=Audio.on?'🔊':'🔇'; if(Audio.on) Audio.start(); else Audio.stop(); }
  muteBtn.addEventListener('click', e=>{ e.stopPropagation(); toggleMute(); });
  async function goFullscreenLandscape(){
    try{ if(isPhone()&&document.documentElement.requestFullscreen){ await document.documentElement.requestFullscreen({navigationUI:'hide'}); }
      if(screen.orientation&&screen.orientation.lock){ await screen.orientation.lock('landscape').catch(()=>{}); } }catch(e){}
    setTimeout(resize,150);
  }

  /* ====================================================================== */
  overworld.init(); showHome(); resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
